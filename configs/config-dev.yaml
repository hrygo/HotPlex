# HotPlex Worker Gateway - Development Configuration
#
# Inherits: config.yaml (base)
# Usage: ./hotplex -config configs/config-dev.yaml
#
# Only fields that differ from base are listed below.

inherits: config.yaml

admin:
  addr: "127.0.0.1:9999"
  tokens:
    - "${ADMIN_TOKEN}"
  rate_limit_enabled: false

gateway:
  addr: "127.0.0.1:8888"

webchat:
  addr: "127.0.0.1:3000"
  enabled: false # dev mode uses next dev server for hot reload

# Pin specific dev origins (not "*") so the gateway emits
# Access-Control-Allow-Credentials — required for cross-origin cookie auth
# (webchat login flow). Next dev server may surface as 127.0.0.1 or localhost.
#
# cookie_same_site=none: dev runs webchat (next dev :3000) and gateway (:8888)
# on different loopback hosts, which browsers treat as cross-site. SameSite=Lax
# (the inherited default) blocks cookie delivery on cross-site fetches, so the
# login cookie set by /api/auth/login is never sent on the follow-up /api/auth/me
# → login appears to fail. SameSite=None requires Secure; loopback origins are
# secure contexts (security.isLocalhost), so Secure cookies work over plain http.
security:
  allowed_origins:
    - "http://127.0.0.1:3000"
    - "http://localhost:3000"
    - "http://127.0.0.1:8888"
    - "http://localhost:8888"
  cookie_same_site: "none"

session:
  retention_period: 24h
  max_concurrent: 100

pool:
  max_size: 50
  max_memory_per_user: 3221225472  # 3GB

worker:
  idle_timeout: 30m
  execution_timeout: 30m
  opencode_server:
    password: "${OPENCODE_SERVER_PASSWORD}"
  acp:
    debug: false
    auto_approve: false
  codex_cli:
    sandbox: "workspace-write"
    approval_mode: "on-request"

log:
  level: "debug"
  format: "text"
  # File logging is disabled in dev (logs go to stderr for live debugging).
  # file:
  #   enabled: false
  #   path: ""
  #   max_size: 10
  #   max_age: 30
  #   max_backups: 100
  #   compress: true
  #   local_time: true

messaging:
  turn_summary_enabled: true
  slack:
    enabled: true
  feishu:
    enabled: true
    worker_type: "claude_code"
  yuanxin:
    enabled: false
    worker_type: "claude_code"
    work_dir: "./.hotplex/workspace"
    tenant: "public"
    namespace: "default"
    app_id: "${YUANXIN_APP_ID}"
    pulsar_url: "${YUANXIN_PULSAR_URL}"
