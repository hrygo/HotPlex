# HotPlex Worker Gateway - Development Configuration
#
# Inherits: config.yaml (base)
# Usage: ./hotplex -config configs/config-dev.yaml
#
# Only fields that differ from base are listed below.

inherits: config.yaml

admin:
  addr: "127.0.0.1:9999"
  tokens:
    - "${ADMIN_TOKEN}"
  rate_limit_enabled: false

gateway:
  addr: "127.0.0.1:8888"

webchat:
  addr: "127.0.0.1:3000"
  enabled: false # dev mode uses next dev server for hot reload

# Pin specific dev origins (not "*") so the gateway emits
# Access-Control-Allow-Credentials — required for cross-origin cookie auth
# (webchat login flow). Next dev server may surface as 127.0.0.1 or localhost.
security:
  allowed_origins:
    - "http://127.0.0.1:3000"
    - "http://localhost:3000"

session:
  retention_period: 24h
  max_concurrent: 100

pool:
  max_size: 50
  max_memory_per_user: 3221225472  # 3GB

worker:
  idle_timeout: 30m
  execution_timeout: 30m
  opencode_server:
    password: "${OPENCODE_SERVER_PASSWORD}"
  acp:
    debug: false

log:
  level: "debug"
  format: "text"

messaging:
  turn_summary_enabled: true
  slack:
    enabled: true
  feishu:
    enabled: true
    worker_type: "claude_code"
  yuanxin:
    enabled: false
    worker_type: "claude_code"
    work_dir: "./.hotplex/workspace"
    tenant: "public"
    namespace: "default"
    app_id: "${YUANXIN_APP_ID}"
    pulsar_url: "${YUANXIN_PULSAR_URL}"
