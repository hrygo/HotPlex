# =============================================================================
# HotPlex Worker Gateway - SLO Definitions
# =============================================================================
# Purpose: Define Service Level Objectives using OpenSLO specification
# Based on: docs/specs/Observability-Spec.md §8
# Generated: 2026-06-04
# Notes: All SLOs reference ACTUAL metric names from the observability spec.
# =============================================================================

apiVersion: openslo/v1
kind: SLO
metadata:
  name: hotplex-session-creation-success-rate
  displayName: "Session Creation Success Rate"
  description: >
    Measures the percentage of successfully started sessions vs failed attempts.
    Target: 99.5% success rate.
spec:
  service: hotplex-gateway
  sli:
    thresholdMetric:
      source: prometheus
      query: |
        sum(rate(hotplex_session_start_attempts_total[5m]))
          /
        (
          sum(rate(hotplex_session_start_attempts_total[5m]))
            +
          sum(rate(hotplex_session_start_errors_total[5m]))
        )
  objectives:
    - displayName: "99.5% Success Rate"
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
  alerting:
    name: session-creation-slo-alert
    burnRate:
      - window: 1h
        threshold: 14.4
      - window: 6h
        threshold: 6
    descriptions:
      - "Session creation success rate below 99.5% target"
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: hotplex-worker-availability
  displayName: "Worker Availability"
  description: >
    Measures the percentage of successful worker starts vs total starts (including crashes).
    Target: 99% worker availability.
spec:
  service: hotplex-gateway
  sli:
    thresholdMetric:
      source: prometheus
      query: |
        sum(rate(hotplex_worker_starts_total{result="success"}[5m]))
          /
        (
          sum(rate(hotplex_worker_starts_total[5m]))
            +
          sum(rate(hotplex_worker_crashes_total[5m]))
        )
  objectives:
    - displayName: "99% Availability"
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
  alerting:
    name: worker-availability-slo-alert
    burnRate:
      - window: 1h
        threshold: 14.4
      - window: 6h
        threshold: 6
    descriptions:
      - "Worker availability below 99% target"
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: hotplex-worker-execution-latency-p99
  displayName: "Worker Execution Latency P99"
  description: >
    Measures the 99th percentile of worker execution duration.
    Target: P99 < 300 seconds.
spec:
  service: hotplex-gateway
  sli:
    thresholdMetric:
      source: prometheus
      query: |
        histogram_quantile(0.99,
          rate(hotplex_worker_execution_duration_seconds_bucket[5m])
        ) < 300
  objectives:
    - displayName: "P99 < 300s"
      target: 1.0
  timeWindow:
    - duration: 30d
      isRolling: true
  alerting:
    name: worker-latency-slo-alert
    descriptions:
      - "Worker execution P99 latency exceeds 300 seconds"
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: hotplex-gateway-http-latency-p99
  displayName: "HTTP Request Latency P99"
  description: >
    Measures the 99th percentile of HTTP request duration.
    Target: P99 < 1 second.
spec:
  service: hotplex-gateway
  sli:
    thresholdMetric:
      source: prometheus
      query: |
        histogram_quantile(0.99,
          rate(http_server_request_duration_seconds_bucket[5m])
        ) < 1
  objectives:
    - displayName: "P99 < 1s"
      target: 1.0
  timeWindow:
    - duration: 30d
      isRolling: true
  alerting:
    name: http-latency-slo-alert
    descriptions:
      - "HTTP request P99 latency exceeds 1 second"
