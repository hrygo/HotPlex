# =============================================================================
# HotPlex Worker Gateway - Prometheus Alerting Rules
# =============================================================================
# Purpose: Define alert rules for critical system conditions
# Based on: docs/specs/Observability-Spec.md §7
# Generated: 2026-06-04
# Notes: All rules reference ACTUAL metric names from the observability spec.
#        Alerts are symptom-based, not root-cause-based.
# =============================================================================

groups:
  # ---------------------------------------------------------------------------
  # Session Alerts
  # ---------------------------------------------------------------------------
  - name: hotplex-session-alerts
    interval: 30s
    rules:
      # CRITICAL: Session creation failure rate > 1% for 5 minutes
      - alert: SessionCreationFailureRate
        expr: |
          (
            sum(rate(hotplex_session_start_errors_total[5m])) > 0
            and
            sum(rate(hotplex_session_start_errors_total[5m]))
              /
            sum(rate(hotplex_session_start_attempts_total[5m])) > 0.01
          )
        for: 5m
        labels:
          severity: critical
          service: hotplex-gateway
          team: platform
        annotations:
          summary: "Session creation failure rate exceeds 1%"
          description: >
            Session start is failing at elevated rate.
            Current failure rate: {{ $value | humanizePercentage }}.
            Check worker pool, database connectivity, and API key status.

      # CRITICAL: Abnormal session termination (crash, zombie)
      - alert: SessionAbnormalTermination
        expr: |
          rate(hotplex_session_terminated_total{reason=~"crash|zombie"}[5m]) > 0
        for: 5m
        labels:
          severity: critical
          service: hotplex-gateway
          team: platform
        annotations:
          summary: "Session abnormally terminated (crash or zombie)"
          description: >
            Session(s) terminated with reason {{ $labels.reason }}.
            Rate: {{ $value | printf "%.3f" }}/s.

      # WARNING: Session success rate below SLO (99.5%)
      - alert: SessionSuccessRateBelowSLO
        expr: |
          sum(rate(hotplex_session_start_attempts_total[5m]))
            /
          (
            sum(rate(hotplex_session_start_attempts_total[5m]))
              +
            sum(rate(hotplex_session_start_errors_total[5m]))
          ) < 0.995
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
          slo: session-availability
        annotations:
          summary: "Session success rate below SLO target (99.5%)"
          description: >
            Current success rate: {{ $value | humanizePercentage }}.
            Target: 99.5%.

  # ---------------------------------------------------------------------------
  # Worker Alerts
  # ---------------------------------------------------------------------------
  - name: hotplex-worker-alerts
    interval: 30s
    rules:
      # WARNING: Worker crash rate > 1% of starts for 5 minutes
      - alert: HighWorkerCrashRate
        expr: |
          sum(rate(hotplex_worker_crashes_total[5m]))
            /
          sum(rate(hotplex_worker_starts_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
          team: platform
        annotations:
          summary: "Worker crash rate is elevated (> 1%)"
          description: >
            Crash rate: {{ $value | humanizePercentage }}.
            Check worker logs and resource constraints.

      # CRITICAL: No active workers for 1 minute — complete outage
      - alert: NoActiveWorkers
        expr: |
          sum(hotplex_worker_running) == 0
        for: 1m
        labels:
          severity: critical
          service: hotplex-gateway
          team: platform
        annotations:
          summary: "No active workers in pool — service outage"
          description: >
            All workers are stopped. Service cannot process sessions.
            Check gateway logs and worker binary availability.

      # WARNING: High worker memory usage (> 90% of limit)
      - alert: HighWorkerMemoryUsage
        expr: |
          hotplex_worker_memory_bytes > 483183820  # 90% of 512MB
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
        annotations:
          summary: "Worker memory usage above 90% of 512MB"
          description: >
            Worker {{ $labels.worker_type }} using {{ $value | humanize }}B.
            Risk of OOM kill if sustained.

  # ---------------------------------------------------------------------------
  # Pool Alerts
  # ---------------------------------------------------------------------------
  - name: hotplex-pool-alerts
    interval: 30s
    rules:
      # CRITICAL: Pool utilization >= 95% for 10 minutes
      - alert: PoolExhaustion
        expr: |
          hotplex_pool_utilization_ratio >= 0.95
        for: 10m
        labels:
          severity: critical
          service: hotplex-gateway
          team: platform
        annotations:
          summary: "Worker pool at 95% capacity — new sessions rejected"
          description: >
            Pool utilization: {{ $value | humanizePercentage }}.
            New sessions are being rejected. Consider scaling.

      # WARNING: Pool double-release bugs detected
      - alert: PoolDoubleReleaseBug
        expr: |
          increase(hotplex_pool_release_errors_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
        annotations:
          summary: "Pool double-release error detected (code bug)"
          description: >
            {{ $value }} double-release errors in the last hour.
            This indicates a mutex/lifecycle bug in pool management.

  # ---------------------------------------------------------------------------
  # Latency Alerts
  # ---------------------------------------------------------------------------
  - name: hotplex-latency-alerts
    interval: 30s
    rules:
      # WARNING: Worker execution P99 > 300s for 10 minutes
      - alert: HighWorkerLatencyP99
        expr: |
          histogram_quantile(0.99,
            rate(hotplex_worker_execution_duration_seconds_bucket[5m])
          ) > 300
        for: 10m
        labels:
          severity: warning
          service: hotplex-gateway
          team: platform
        annotations:
          summary: "Worker execution P99 latency exceeds 300s"
          description: >
            P99 worker latency: {{ $value | printf "%.1f" }}s.
            Workers may be stuck or overloaded.

      # WARNING: Init handshake P99 > 5s for 5 minutes
      - alert: HighInitLatencyP99
        expr: |
          histogram_quantile(0.99,
            rate(hotplex_gateway_init_handshake_duration_seconds_bucket[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
        annotations:
          summary: "WS init handshake P99 latency exceeds 5s"
          description: >
            Init handshake P99: {{ $value | printf "%.1f" }}s.
            Check session manager and database performance.

      # WARNING: HTTP server P99 > 1s for 5 minutes
      - alert: HighHTTPLatencyP99
        expr: |
          histogram_quantile(0.99,
            rate(http_server_request_duration_seconds_bucket[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
        annotations:
          summary: "HTTP server P99 latency exceeds 1s"
          description: >
            HTTP P99 latency: {{ $value | printf "%.2f" }}s.
            Check downstream dependencies.

  # ---------------------------------------------------------------------------
  # Gateway Alerts
  # ---------------------------------------------------------------------------
  - name: hotplex-gateway-alerts
    interval: 30s
    rules:
      # WARNING: Delta drop rate > 10/s for 5 minutes (severe backpressure)
      - alert: HighDeltaDropRate
        expr: |
          rate(hotplex_gateway_deltas_dropped_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
          team: platform
        annotations:
          summary: "Delta event drop rate exceeds 10/s (severe backpressure)"
          description: >
            Drop rate: {{ $value | printf "%.1f" }}/s.
            Clients may experience missing streaming content.

      # WARNING: Error rate > 1/s for 5 minutes
      - alert: HighErrorRate
        expr: |
          rate(hotplex_gateway_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
        annotations:
          summary: "Gateway error rate exceeds 1/s"
          description: >
            Error rate: {{ $value | printf "%.2f" }}/s.
            Error code: {{ $labels.error_code }}.

      # WARNING: High WebSocket connection churn (> 10% close rate)
      - alert: HighConnectionChurn
        expr: |
          rate(hotplex_gateway_messages_total{direction="incoming",event_type="close"}[5m])
            /
          rate(hotplex_gateway_messages_total{direction="incoming"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
        annotations:
          summary: "High WebSocket connection churn detected"
          description: >
            Connection close rate is high. Clients may be unstable.

  # ---------------------------------------------------------------------------
  # Cron Alerts
  # ---------------------------------------------------------------------------
  - name: hotplex-cron-alerts
    interval: 30s
    rules:
      # WARNING: Any cron job failure in the last 10 minutes
      - alert: CronJobFailures
        expr: |
          rate(hotplex_cron_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          service: hotplex-gateway
        annotations:
          summary: "Cron job {{ $labels.job_name }} is failing"
          description: >
            Error type: {{ $labels.error_type }}.
            Job: {{ $labels.job_name }}.

  # ---------------------------------------------------------------------------
  # Brain LLM Alerts
  # ---------------------------------------------------------------------------
  - name: hotplex-brain-alerts
    interval: 30s
    rules:
      # WARNING: Brain LLM error rate > 0.1/s for 5 minutes
      - alert: BrainHighErrorRate
        expr: |
          rate(hotplex_brain_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: hotplex-gateway
        annotations:
          summary: "Brain LLM error rate is elevated"
          description: >
            Error rate: {{ $value | printf "%.2f" }}/s.
            Model: {{ $labels.model }}.


